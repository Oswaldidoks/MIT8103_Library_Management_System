# PostgreSQL 16 primary tuning for asynchronous physical streaming replication.
# The official image's PGDATA holds pg_hba.conf; the init script appends the
# replication rule there. Do not copy this into a production service as-is.
listen_addresses = '*'
port = 5432
wal_level = replica
max_wal_senders = 10
max_replication_slots = 5
wal_keep_size = '256MB'
hot_standby = on
synchronous_commit = on
# No synchronous_standby_names: streaming remains asynchronous.
